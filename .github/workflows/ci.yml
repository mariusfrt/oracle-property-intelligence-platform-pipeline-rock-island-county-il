name: CI

on:
  push:
    branches: [main, feat/rock-island-pipeline]
  pull_request:

# Typecheck and unit tests only. No AWS, Bedrock, Pinata, or DuckDB data is
# required: the enriched Parquet is intentionally gitignored, so data-dependent
# steps (cdk synth, query-layer integration) are deliberately kept out of CI.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
