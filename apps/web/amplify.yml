version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - cd ../.. && pnpm install --frozen-lockfile
        - pnpm --filter @oracle/shared build
    build:
      commands:
        - cd ../.. && pnpm --filter @oracle/web build
  artifacts:
    baseDirectory: apps/web/.next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - apps/web/.next/cache/**/*
